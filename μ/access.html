  <nav class="nav">

  <div class="wrap">
    <header class="hero">
      <img class="hero-banner" src="./png/banner.png" alt="μ隔離観察施設">
      <div class="hero-meta">
        <p class="sub">REPORT-μ-004　／　ACCESS</p>
      </div>
    </header>

    <section>
      <div class="sec-id">開催スケジュール</div>
      <p>第2・第4土曜日　22:00～</p>
    </section>

    <section>
      <div class="sec-id">参加について（心理士）</div>

      <p>応募は公式X（@vrc_mu__）の案内に従ってください</p>

        公式X：<a href="https://x.com/vrc_mu__" target="_blank" rel="noopener">@vrc_mu__</a><br>

    </section>

    <footer>
      μ隔離観察施設
    </footer>
  </div>

  <script>
    fetch('./info.html')
      .then(res => {
        if (!res.ok) throw new Error('読み込み失敗');
        return res.text();
      })
      .then(html => {
        const temp = document.createElement('div');
        temp.innerHTML = html.trim();
        const notice = temp.firstElementChild;
        const wrap = document.querySelector('.wrap');
        if (wrap && notice) {
          wrap.insertBefore(notice, wrap.firstChild);
        }
      })
      .catch(err => console.error('お知らせ読み込みエラー:', err));
  </script>
