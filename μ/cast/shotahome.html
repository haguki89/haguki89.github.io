<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-MH324TNG"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../png/favicon.png" type="image/png">
  <title>ショウタの日記</title>
  <style>
    :root {
      --bg: #f4f8f4;
      --card: #ffffff;
      --green: #6b9e78;
      --green-soft: #a8c5b0;
      --green-dark: #4a7c59;
      --text: #3a4a3e;
      --muted: #7a8a7e;
      --border: #d4e4d8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      line-height: 1.8;
    }

    .banner {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      display: block;
      background: var(--green-soft);
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 32px 20px 60px;
    }

    .diary-entry {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px 24px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(107, 158, 120, 0.08);
    }

    .date {
      color: var(--green);
      font-weight: bold;
      font-size: 0.95rem;
      margin-bottom: 10px;
      letter-spacing: 0.05em;
    }

    .diary-entry p {
      margin-bottom: 8px;
    }

    .diary-entry p:last-child {
      margin-bottom: 0;
    }

    .notice {
      margin-top: 48px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.7;
    }

    .notice p {
      margin: 4px 0;
    }

    footer {
      margin-top: 24px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      user-select: none;
    }

    /* カスタムモーダル */
    #passwordModal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 9999;
      align-items: center;
      justify-content: center;
    }

    #passwordModal .modal-inner {
      background: #fff;
      padding: 28px 32px;
      border-radius: 16px;
      width: 90%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    #passwordModal p {
      margin-bottom: 16px;
      font-size: 15px;
      color: #3a4a3e;
    }

    #pwInput {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d4e4d8;
      border-radius: 8px;
      font-size: 15px;
      margin-bottom: 16px;
    }

    #passwordModal button {
      border: none;
      padding: 8px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    #pwOk {
      background: #6b9e78;
      color: #fff;
      margin-right: 8px;
    }

    #pwCancel {
      background: #e0e0e0;
    }
  </style>
</head>
<body>
  <img class="banner" src="../png/shotahome.png" alt="バナー">

  <div class="container">

    <div class="diary-entry">
      <div class="date">20xx/10/24</div>
      <p>今日は国外心理士の人たちが来る日だった。</p>
      <p>ヒカルが桜もちくれた</p>
    </div>

    <div class="diary-entry">
      <div class="date">20xx/08/13</div>
      <p>ペンのインクがまた切れた！</p>
      <p>あぁ、ロッカーに替えのペン入れとけばいいんだ</p>
    </div>

    <div class="diary-entry">
      <div class="date">20xx/06/11</div>
      <p>ホワイトボードのインクが取れなくなってきた。</p>
      <p>新しいボードに張り替えなくちゃ</p>
    </div>

    <div class="diary-entry">
      <div class="date">20xx/04/17</div>
      <p>施設のホームページを作ることになった。</p>
      <p>こっそり秘密のページ作っちゃおっと</p>
    </div>

    <div class="notice">
      <p>*本イベント内の設定情報です。実在の人物を指すものではありません。</p>
    </div>

    <footer id="secretFooter">μ隔離観察施設 &copy;</footer>
  </div>

  <!-- カスタムモーダル -->
  <div id="passwordModal">
    <div class="modal-inner">
      <p>管理者パスワードを入力してください</p>
      <input type="password" id="pwInput" placeholder="パスワード">
      <div>
        <button id="pwOk">OK</button>
        <button id="pwCancel">キャンセル</button>
      </div>
    </div>
  </div>

  <script>
    let clickCount = 0;
    let clickTimer = null;

    const modal = document.getElementById('passwordModal');
    const pwInput = document.getElementById('pwInput');
    const pwOk = document.getElementById('pwOk');
    const pwCancel = document.getElementById('pwCancel');

    document.getElementById('secretFooter').addEventListener('click', function () {
      clickCount++;

      clearTimeout(clickTimer);
      clickTimer = setTimeout(() => {
        clickCount = 0;
      }, 3000);

      if (clickCount === 5) {
        clickCount = 0;
        modal.style.display = 'flex';
        pwInput.value = '';
        pwInput.focus();
      }
    });

    pwOk.addEventListener('click', function () {
      if (pwInput.value === 'admin') {
        window.location.href = 'admin.html';
      } else {
        alert('パスワードが違います');
        modal.style.display = 'none';
      }
    });

    pwCancel.addEventListener('click', function () {
      modal.style.display = 'none';
    });

    pwInput.addEventListener('keypress', function (e) {
      if (e.key === 'Enter') pwOk.click();
    });
  </script>
</body>
</html>
