<div class="container">
  <h1>🎣 釣り情報一覧</h1>
  <nav style="text-align:center; margin:12px 0 20px; font-size:0.95em;">
    <a href="https://mfre.jp/pokopokotimecalc/" style="margin:0 10px;">HOME</a>

  </nav>

  <div class="section">
    <h2>池の魚</h2>
    <table>
      <thead>
        <tr>
          <th>名前</th>
          <th>売値</th>
          <th>経験値(釣り時)</th>
          <th>確率(つりざおレベル5)</th>
          <th>確率(つりざおレベル7)</th>
        </tr>
      </thead>
      <tbody id="fishTable"></tbody>
    </table>
    <p class="note" style="margin-top:12px;">
      ※ 経験値は現在調査中です。判明次第更新します。<br>
      ※ 確率データ引用元：<a href="https://x.com/stcan_vrc/status/2122344072815980556?a=pc4QzBkfy1cYKUJVfSU&s=20" target="_blank" rel="noopener">すときゃん 様</a>
    </p>

<script src="fishing-data.js"></script>
<script>
function renderFishTable() {
  const tbody = document.getElementById("fishTable");
  tbody.innerHTML = "";
  FISH.forEach(f => {
    tbody.innerHTML += `
      <tr>
        <td>${f.name}</td>
        <td>${f.price.toLocaleString()}</td>
        <td>${f.fishingex ?? "調査中"}</td>
        <td>${f.probLv5 != null ? f.probLv5 + "%" : "調査中"}</td>
        <td>${f.probLv7 != null ? f.probLv7 + "%" : "調査中"}</td>
      </tr>`;
  });
}
renderFishTable();
</script>
