<!DOCTYPE html>
<html lang="ja">
<head>
<script async src="https://www.googletagmanager.com/gtm.js?id=GTM-MWK5M3C6"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ぽこぽこファーム 料理情報</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">
<link rel="stylesheet" href="style.css">
<style>
  table {
    width: 100%;
    table-layout: fixed;
    border-collapse: collapse;
  }
  th, td {
    padding: 8px 10px;
    text-align: left;
    border-bottom: 1px solid #eee;
    overflow-wrap: break-word;
    word-break: break-all;
  }
  th:nth-child(1), td:nth-child(1) { width: 22%; } /* 料理名 */
  th:nth-child(2), td:nth-child(2) { width: 10%; } /* 開放Lv */
  th:nth-child(3), td:nth-child(3) { width: 10%; } /* 売値 */
  th:nth-child(4), td:nth-child(4) { width: 10%; } /* 経験値 */
  th:nth-child(5), td:nth-child(5) { width: 10%; } /* 調理(分) */
  th:nth-child(6), td:nth-child(6) { width: 38%; } /* 主な材料 */
</style>
</head>
<body>
<div class="container">
  <h1>🍳 料理情報一覧</h1>
  <nav style="text-align:center; margin:12px 0 20px; font-size:0.95em;">
    <a href="https://mfre.jp/pokopokotimecalc/" style="margin:0 10px;">HOME</a>
    <a href="https://mfre.jp/pokopokotimecalc/level-effects" style="margin:0 10px;">レベル効果</a>
    <a href="https://mfre.jp/pokopokotimecalc/crops" style="margin:0 10px;">作物情報一覧</a>
    <a href="https://mfre.jp/pokopokotimecalc/fishing" style="margin:0 10px;">釣り</a>
    <a href="https://mfre.jp/pokopokotimecalc/cooking" style="margin:0 10px;">料理</a>
  </nav>

  <p class="note" style="text-align:center;">経験値は後々の経験値効率計算用に保持しています。現在「調査中」のものが多いです。</p>

  <div id="cookingSections"></div>
</div>

<footer>
  <p>当サイトはファンメイドです。公式とは一切関係ありません。</p>
  <p><a href="contact">お問い合わせ</a></p>
  <p>© 2026 ぽこぽこファーム 時間効率計算ツール</p>
</footer>

<script src="cooking-data.js"></script>
<script>
function renderCooking() {
  const container = document.getElementById("cookingSections");
  container.innerHTML = "";

  const methods = [...new Set(COOKING.map(c => c.method))];

  methods.forEach(method => {
    const recipes = COOKING.filter(c => c.method === method);
    const section = document.createElement("div");
    section.className = "section";
    section.innerHTML = `
      <h2>${method}</h2>
      <table>
        <thead>
          <tr>
            <th>料理名</th>
            <th>開放Lv</th>
            <th>売値</th>
            <th>経験値</th>
            <th>調理(分)</th>
            <th>主な材料</th>
          </tr>
        </thead>
        <tbody>
          ${recipes.map(r => `
            <tr>
              <td>${r.name}</td>
              <td>${r.unlockLv ?? "調査中"}</td>
              <td>${r.price.toLocaleString()}</td>
              <td>${r.exp ?? "調査中"}</td>
              <td>${r.time}</td>
              <td>${r.ingredients}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    `;
    container.appendChild(section);
  });
}

renderCooking();
</script>
</body>
</html>
